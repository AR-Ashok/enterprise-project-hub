<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Project & Issue Management Portal</title>
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style id="dynamic-font-style">
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased overflow-x-hidden">
    <div id="app" class="h-full flex flex-col"></div>

    <script>
        const STORAGE_KEY = 'pb_manager_enterprise_pwa_v1';

        const defaultState = {
            isLoggedIn: false,
            currentUser: null, 
            authorizedUsers: {
                'admin@projectapp.com': 'admin',
                'rose@projectapp.com': 'user',
                'lotus@projectapp.com': 'user',
                'user@projectapp.com': 'user'
            },
            activeTab: 'projects',
            selectedProjectId: null,
            settings: {
                language: 'en',
                font: 'Inter'
            },
            projects: [
                {
                    id: '1',
                    name: 'Project A',
                    projectType: 'iOS App Development',
                    description: 'Build native SwiftUI dashboard features and local notifications.',
                    status: 'In Progress',
                    progress: 0.65,
                    owner: 'admin@projectapp.com',
                    assignedTo: 'rose@projectapp.com'
                },
                {
                    id: '2',
                    name: 'Project B',
                    projectType: 'Cloud Backend API',
                    description: 'Deploy Node.js SMS gateway integration via Twilio.',
                    status: 'Not Started',
                    progress: 0.15,
                    owner: 'admin@projectapp.com',
                    assignedTo: 'lotus@projectapp.com'
                }
            ],
            documents: [
                { id: 'doc1', projectId: '1', name: 'Architecture_Spec_v1.pdf', size: '2.4 MB', type: 'application/pdf', uploadedBy: 'admin@projectapp.com', date: '2026-06-01' }
            ],
            issues: [
                {
                    id: 'i1',
                    projectId: '1',
                    title: 'Push notification token expiry on iOS 18',
                    description: 'Tokens fail to refresh background state after 24 hours.',
                    status: 'In Progress',
                    priority: 'High',
                    startDate: '2026-06-10',
                    endDate: '2026-06-20',
                    createdAt: '2026-06-10',
                    response: 'Investigating background fetch entitlement config.',
                    attachment: 'error_log_ios18.txt',
                    assignedUser: 'rose@projectapp.com',
                    createdBy: 'admin@projectapp.com'
                }
            ],
            issueFilters: {
                searchUser: '',
                status: 'All',
                priority: 'All',
                startDate: '',
                endDate: '',
                createDate: ''
            },
            notificationsLog: [],
            toast: null
        };

        let state = loadState();

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { 
                    const parsed = JSON.parse(saved);
                    applyFontFamily(parsed.settings?.font || 'Inter');
                    return parsed;
                } catch (e) { console.error(e); }
            }
            applyFontFamily(defaultState.settings.font);
            return defaultState;
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error('Storage quota or private mode error:', e);
            }
        }

        function applyFontFamily(fontName) {
            const styleTag = document.getElementById('dynamic-font-style');
            if (styleTag) {
                styleTag.innerHTML = `body { font-family: '${fontName}', sans-serif; }`;
            }
        }

        function showToast(message, type = 'success') {
            state.toast = { message, type };
            render();
            setTimeout(() => {
                if (state.toast && state.toast.message === message) {
                    state.toast = null;
                    render();
                }
            }, 3500);
        }

        function dispatchNotifications(recipientEmail, subject, messageBody) {
            const logEntry = {
                id: 'notif_' + Date.now(),
                timestamp: new Date().toISOString(),
                to: recipientEmail,
                channels: ['Email (SMTP/SendGrid)', 'WhatsApp Cloud API'],
                subject,
                body: messageBody
            };
            state.notificationsLog.unshift(logEntry);
            showToast(`📧 Email & 📱 WhatsApp Dispatched to ${recipientEmail}`);
        }

        window.actions = {
            login(email, pin) {
                email = email.trim().toLowerCase();
                if (state.authorizedUsers[email]) {
                    const role = state.authorizedUsers[email];
                    state.isLoggedIn = true;
                    state.currentUser = { email, role };
                    saveState();
                    render();
                    showToast(`Welcome back, ${email}!`);
                } else {
                    showToast('Access Denied: Email not authorized.', 'error');
                }
            },
            logout() {
                state.isLoggedIn = false;
                state.currentUser = null;
                saveState();
                render();
                showToast('Successfully logged out.');
            },
            setActiveTab(tab) {
                state.activeTab = tab;
                if (tab !== 'project-detail') state.selectedProjectId = null;
                render();
            },
            viewProjectDetails(projectId) {
                state.selectedProjectId = projectId;
                state.activeTab = 'project-detail';
                render();
            },
            updateSettings(language, font) {
                state.settings.language = language;
                state.settings.font = font;
                applyFontFamily(font);
                saveState();
                render();
                showToast('Preferences updated successfully.');
            },
            addUser(email, role) {
                if (state.currentUser?.role !== 'admin') return;
                email = email.trim().toLowerCase();
                if (!email) return;
                state.authorizedUsers[email] = role;
                saveState();
                render();
                showToast(`User ${email} granted access as ${role}.`);
            },
            editUserRole(email, newRole) {
                if (state.currentUser?.role !== 'admin') return;
                if (email === 'admin@projectapp.com' && newRole !== 'admin') {
                    showToast('Cannot downgrade primary admin role.', 'error');
                    return;
                }
                state.authorizedUsers[email] = newRole;
                saveState();
                render();
                showToast(`Updated role for ${email} to ${newRole}`);
            },
            removeUser(email) {
                if (state.currentUser?.role !== 'admin') return;
                if (email === 'admin@projectapp.com') {
                    showToast('Cannot remove primary administrator.', 'error');
                    return;
                }
                delete state.authorizedUsers[email];
                saveState();
                render();
                showToast(`Revoked access for ${email}`);
            },
            addProject(proj) {
                const newProj = { id: Date.now().toString(), owner: state.currentUser.email, ...proj };
                state.projects.push(newProj);
                saveState();
                render();
                showToast('Project created successfully.');
                dispatchNotifications(newProj.assignedTo, `New Project Assigned: ${newProj.name}`, `Assigned as member for ${newProj.name}.`);
            },
            editProject(id, updatedFields) {
                const proj = state.projects.find(p => p.id === id);
                if (!proj) return;
                const isOwner = proj.owner === state.currentUser.email || state.currentUser.role === 'admin';

                if (isOwner) {
                    Object.assign(proj, updatedFields);
                } else {
                    if (updatedFields.status) proj.status = updatedFields.status;
                }
                saveState();
                render();
                showToast('Project updated successfully.');
            },
            deleteProject(id) {
                const proj = state.projects.find(p => p.id === id);
                if (!proj) return;
                if (proj.owner !== state.currentUser.email && state.currentUser.role !== 'admin') {
                    showToast('Permission denied.', 'error');
                    return;
                }
                state.projects = state.projects.filter(p => p.id !== id);
                state.issues = state.issues.filter(i => i.projectId !== id);
                state.documents = state.documents.filter(d => d.projectId !== id);
                saveState();
                render();
                showToast('Project deleted.');
            },
            uploadDocument(projectId, name, size, type) {
                const newDoc = {
                    id: 'doc_' + Date.now(),
                    projectId,
                    name,
                    size: size || '1.2 MB',
                    type: type || 'application/octet-stream',
                    uploadedBy: state.currentUser.email,
                    date: new Date().toISOString().split('T')[0]
                };
                state.documents.push(newDoc);
                saveState();
                render();
                showToast(`Document "${name}" attached successfully.`);
            },
            deleteDocument(docId) {
                state.documents = state.documents.filter(d => d.id !== docId);
                saveState();
                render();
                showToast('Document removed.');
            },
            createIssue(issue) {
                const proj = state.projects.find(p => p.id === issue.projectId);
                const newIssue = {
                    id: 'i_' + Date.now(),
                    ...issue,
                    createdBy: state.currentUser.email
                };
                state.issues.push(newIssue);
                saveState();
                render();
                showToast('Issue created successfully.');
                dispatchNotifications(newIssue.assignedUser, `New Issue in ${proj.name}: ${newIssue.title}`, `Priority: ${newIssue.priority}. Assigned to you.`);
            },
            updateIssueUserFields(issueId, response, attachment, status, priority) {
                const issue = state.issues.find(i => i.id === issueId);
                if (!issue) return;
                issue.response = response;
                if (attachment) issue.attachment = attachment;
                if (status) issue.status = status;
                if (priority) issue.priority = priority;
                saveState();
                render();
                showToast('Issue update saved.');
                const proj = state.projects.find(p => p.id === issue.projectId);
                dispatchNotifications(proj.owner, `Issue Updated: ${issue.title}`, `User updated status to [${issue.status}].`);
            },
            setIssueStatus(issueId, newStatus) {
                const issue = state.issues.find(i => i.id === issueId);
                if (!issue) return;
                issue.status = newStatus;
                saveState();
                render();
                showToast(`Issue status updated to ${newStatus}`);
                dispatchNotifications(issue.assignedUser, `Issue Status Changed: ${issue.title}`, `New status: ${newStatus}`);
            },
            updateFilters(filters) {
                state.issueFilters = { ...state.issueFilters, ...filters };
                render();
            },
            resetFilters() {
                state.issueFilters = { searchUser: '', status: 'All', priority: 'All', startDate: '', endDate: '', createDate: '' };
                render();
            }
        };

        function render() {
            const app = document.getElementById('app');
            if (!state.isLoggedIn) {
                app.innerHTML = renderLogin();
            } else {
                app.innerHTML = renderDashboard();
            }
            lucide.createIcons();
        }

        function renderLogin() {
            return `
                <div class="flex-1 flex flex-col justify-center items-center px-4 bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 text-white">
                    <div class="max-w-md w-full space-y-8 bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl border border-slate-800 shadow-2xl">
                        <div class="text-center">
                            <div class="mx-auto h-16 w-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 mb-4">
                                <i data-lucide="shield-alert" class="w-8 h-8"></i>
                            </div>
                            <h2 class="text-2xl font-bold tracking-tight">Enterprise Project Portal</h2>
                            <p class="mt-2 text-xs text-slate-400">Cross-Platform Web App (iOS, Android, Windows, Mac)</p>
                        </div>
                        <form class="mt-8 space-y-6" onsubmit="event.preventDefault(); window.actions.login(this.email.value, this.pin.value);">
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                                    <input name="email" type="email" required placeholder="admin@projectapp.com" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                                    <input name="pin" type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 font-medium rounded-xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center space-x-2 text-sm">
                                <i data-lucide="log-in" class="w-4 h-4"></i>
                                <span>Sign In</span>
                            </button>
                        </form>
                        <div class="mt-6 pt-4 border-t border-slate-800 text-center">
                            <p class="text-xs text-slate-400 mb-2">Quick Demo Accounts:</p>
                            <div class="flex gap-2 justify-center">
                                <button onclick="document.querySelector('[name=email]').value='admin@projectapp.com'; document.querySelector('[name=pin]').value='admin';" class="text-xs bg-purple-950 text-purple-300 border border-purple-800 px-3 py-1.5 rounded-lg">👑 Admin</button>
                                <button onclick="document.querySelector('[name=email]').value='rose@projectapp.com'; document.querySelector('[name=pin]').value='user';" class="text-xs bg-blue-950 text-blue-300 border border-blue-800 px-3 py-1.5 rounded-lg">👤 User (Rose)</button>
                            </div>
                        </div>
                    </div>
                </div>
                ${renderToast()}
            `;
        }

        function renderDashboard() {
            const isAdmin = state.currentUser.role === 'admin';
            return `
                <div class="flex h-full overflow-hidden relative">
                    <!-- Sidebar for Desktop & Tablets -->
                    <aside class="hidden md:flex flex-col w-64 bg-slate-900 text-slate-300 border-r border-slate-800">
                        <div class="p-6 flex items-center space-x-3 border-b border-slate-800">
                            <div class="h-10 w-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold">
                                <i data-lucide="briefcase" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h1 class="font-bold text-white text-sm">Enterprise Hub</h1>
                                <span class="text-xs text-slate-400">Cross-Platform PWA</span>
                            </div>
                        </div>
                        <nav class="flex-1 p-4 space-y-1">
                            <button onclick="window.actions.setActiveTab('projects')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium transition ${state.activeTab === 'projects' || state.activeTab === 'project-detail' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}">
                                <i data-lucide="folder-kanban" class="w-4 h-4"></i>
                                <span>Projects & Issues</span>
                            </button>
                            <button onclick="window.actions.setActiveTab('settings')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium transition ${state.activeTab === 'settings' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}">
                                <i data-lucide="settings" class="w-4 h-4"></i>
                                <span>Settings</span>
                            </button>
                            ${isAdmin ? `
                                <button onclick="window.actions.setActiveTab('accounts')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-medium transition ${state.activeTab === 'accounts' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}">
                                    <i data-lucide="users" class="w-4 h-4"></i>
                                    <span>Accounts</span>
                                </button>
                            ` : ''}
                        </nav>
                        <div class="p-4 border-t border-slate-800 bg-slate-950">
                            <div class="flex items-center space-x-3 mb-3">
                                <div class="w-8 h-8 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center font-bold text-xs">
                                    ${state.currentUser.email.charAt(0).toUpperCase()}
                                </div>
                                <div class="overflow-hidden flex-1">
                                    <p class="text-xs font-medium text-white truncate">${state.currentUser.email}</p>
                                    <span class="text-[10px] text-slate-400">${state.currentUser.role}</span>
                                </div>
                            </div>
                            <button onclick="window.actions.logout()" class="w-full py-2 bg-slate-800 hover:bg-red-950 hover:text-red-400 border border-slate-700 text-slate-300 rounded-lg text-xs transition">Sign Out</button>
                        </div>
                    </aside>

                    <!-- Main View -->
                    <div class="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-hidden pb-16 md:pb-0">
                        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 z-10 shrink-0">
                            <h2 class="text-sm font-bold text-slate-800 capitalize">
                                ${state.activeTab === 'project-detail' ? 'Project Dashboard & Issue Log' : state.activeTab}
                            </h2>
                            <span class="text-xs px-3 py-1 rounded-full bg-blue-50 text-blue-700 font-semibold truncate max-w-[200px]">
                                ${state.currentUser.email}
                            </span>
                        </header>
                        <main class="flex-1 overflow-y-auto p-4 sm:p-6">
                            <div class="max-w-6xl mx-auto">
                                ${state.activeTab === 'projects' ? renderProjectsTab() : ''}
                                ${state.activeTab === 'project-detail' ? renderProjectDetailTab() : ''}
                                ${state.activeTab === 'settings' ? renderSettingsTab() : ''}
                                ${state.activeTab === 'accounts' ? renderAccountsTab() : ''}
                            </div>
                        </main>
                    </div>

                    <!-- Mobile Bottom Navigation Bar for iOS & Android -->
                    <nav class="md:hidden absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-3 px-2 z-30 shadow-lg">
                        <button onclick="window.actions.setActiveTab('projects')" class="flex flex-col items-center text-[10px] font-semibold ${state.activeTab === 'projects' || state.activeTab === 'project-detail' ? 'text-blue-600' : 'text-slate-400'}">
                            <i data-lucide="folder-kanban" class="w-5 h-5 mb-0.5"></i>
                            <span>Projects</span>
                        </button>
                        <button onclick="window.actions.setActiveTab('settings')" class="flex flex-col items-center text-[10px] font-semibold ${state.activeTab === 'settings' ? 'text-blue-600' : 'text-slate-400'}">
                            <i data-lucide="settings" class="w-5 h-5 mb-0.5"></i>
                            <span>Settings</span>
                        </button>
                        ${isAdmin ? `
                            <button onclick="window.actions.setActiveTab('accounts')" class="flex flex-col items-center text-[10px] font-semibold ${state.activeTab === 'accounts' ? 'text-blue-600' : 'text-slate-400'}">
                                <i data-lucide="users" class="w-5 h-5 mb-0.5"></i>
                                <span>Accounts</span>
                            </button>
                        ` : ''}
                        <button onclick="window.actions.logout()" class="flex flex-col items-center text-[10px] font-semibold text-red-500">
                            <i data-lucide="log-out" class="w-5 h-5 mb-0.5"></i>
                            <span>Logout</span>
                        </button>
                    </nav>
                </div>
                ${renderToast()}
            `;
        }

        function renderProjectsTab() {
            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <h3 class="text-lg font-bold text-slate-900">Project Directory & Owners</h3>
                            <p class="text-xs text-slate-500">Manage projects, responsible owners, assigned members, and attached drive documents.</p>
                        </div>
                        <button onclick="openAddProjectModal()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow transition flex items-center justify-center space-x-2">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>Create Project</span>
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${state.projects.map(p => {
                            const projDocs = state.documents.filter(d => d.projectId === p.id);
                            return `
                                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between space-y-4">
                                    <div>
                                        <div class="flex justify-between items-start">
                                            <div>
                                                <span class="text-[10px] font-bold text-blue-600 uppercase">${p.projectType}</span>
                                                <h4 class="text-base font-bold text-slate-900">${p.name}</h4>
                                            </div>
                                            <span class="px-2 py-1 text-xs font-semibold rounded-lg bg-amber-50 text-amber-700 border border-amber-200">${p.status}</span>
                                        </div>
                                        <p class="text-xs text-slate-600 mt-2">${p.description}</p>
                                        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between text-xs text-slate-500">
                                            <span>Owner: <strong class="text-slate-800">${p.owner}</strong></span>
                                            <span>Assigned: <strong class="text-slate-800">${p.assignedTo}</strong></span>
                                        </div>

                                        <!-- Document Repository Preview -->
                                        <div class="mt-4 pt-3 border-t border-slate-100 space-y-2">
                                            <div class="flex items-center justify-between">
                                                <span class="text-[11px] font-bold text-slate-700 uppercase flex items-center space-x-1">
                                                    <i data-lucide="paperclip" class="w-3.5 h-3.5 text-blue-600"></i>
                                                    <span>Attached Documents (${projDocs.length})</span>
                                                </span>
                                                <button onclick="openUploadDocumentModal('${p.id}')" class="text-[11px] text-blue-600 hover:underline font-semibold">+ Attach File</button>
                                            </div>
                                            <div class="space-y-1">
                                                ${projDocs.length === 0 ? '<p class="text-[10px] text-slate-400 italic">No documents attached yet.</p>' : ''}
                                                ${projDocs.map(d => `
                                                    <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-100 text-xs">
                                                        <div class="flex items-center space-x-2 truncate">
                                                            <i data-lucide="file-text" class="w-3.5 h-3.5 text-slate-400"></i>
                                                            <span class="font-medium text-slate-700 truncate">${d.name}</span>
                                                            <span class="text-[10px] text-slate-400">(${d.size})</span>
                                                        </div>
                                                        <div class="flex items-center space-x-1">
                                                            <button onclick="showToast('Downloading ${d.name}...')" class="p-1 text-slate-500 hover:text-blue-600" title="Download"><i data-lucide="download" class="w-3.5 h-3.5"></i></button>
                                                            <button onclick="window.actions.deleteDocument('${d.id}')" class="p-1 text-slate-400 hover:text-red-600" title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                                        </div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="flex justify-between items-center pt-3 border-t border-slate-100">
                                        <button onclick="window.actions.viewProjectDetails('${p.id}')" class="px-4 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium rounded-xl text-xs transition flex items-center space-x-1.5">
                                            <i data-lucide="list-todo" class="w-4 h-4"></i>
                                            <span>View Issue Dashboard</span>
                                        </button>
                                        <div class="flex space-x-2">
                                            <button onclick="openEditProjectModal('${p.id}')" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs" title="Edit Project">
                                                <i data-lucide="edit-3" class="w-4 h-4"></i>
                                            </button>

        function renderProjectDetailTab() {
            const project = state.projects.find(p => p.id === state.selectedProjectId);
            if (!project) return `<div>Project not found.</div>`;

            let projIssues = state.issues.filter(i => i.projectId === project.id);
            const isOwner = project.owner === state.currentUser.email || state.currentUser.role === 'admin';

            const filters = state.issueFilters;
            if (filters.searchUser) {
                projIssues = projIssues.filter(i => i.assignedUser.toLowerCase().includes(filters.searchUser.toLowerCase()));
            }
            if (filters.status !== 'All') {
                projIssues = projIssues.filter(i => i.status === filters.status);
            }
            if (filters.priority !== 'All') {
                projIssues = projIssues.filter(i => i.priority === filters.priority);
            }
            if (filters.startDate) {
                projIssues = projIssues.filter(i => i.startDate >= filters.startDate);
            }
            if (filters.endDate) {
                projIssues = projIssues.filter(i => i.endDate <= filters.endDate);
            }
            if (filters.createDate) {
                projIssues = projIssues.filter(i => i.createdAt === filters.createDate);
            }

            const statusCounts = {
                Open: state.issues.filter(i => i.projectId === project.id && i.status === 'Open').length,
                'In Progress': state.issues.filter(i => i.projectId === project.id && i.status === 'In Progress').length,
                Resolved: state.issues.filter(i => i.projectId === project.id && i.status === 'Resolved').length,
                Closed: state.issues.filter(i => i.projectId === project.id && i.status === 'Closed').length,
                Reopened: state.issues.filter(i => i.projectId === project.id && i.status === 'Reopened').length

            return `
                <div class="space-y-6">
                    <button onclick="window.actions.setActiveTab('projects')" class="text-xs text-blue-600 hover:underline flex items-center space-x-1">

                            <h3 class="text-xl font-bold text-slate-900">${project.name}</h3>
                            <p class="text-xs text-slate-500 mt-1">${project.description}</p>
                            <div class="mt-3 flex gap-4 text-xs text-slate-600">
                                <span>Owner: <strong>${project.owner}</strong></span>
                                <span>Assigned Member: <strong>${project.assignedTo}</strong></span>
                            </div>
                        </div>
                        <button onclick="openCreateIssueModal('${project.id}')" class="self-start bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow transition flex items-center space-x-2">
                            <i data-lucide="plus-circle" class="w-4 h-4"></i>
                            <span>Create New Issue</span>

                    </div>

                    <!-- Status Count Metrics Dashboard -->
                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">

                            <p class="text-xs font-semibold text-slate-400 uppercase">Open</p>
                            <h4 class="text-xl font-bold text-blue-600 mt-1">${statusCounts.Open}</h4>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-400 uppercase">In Progress</p>
                            <h4 class="text-xl font-bold text-amber-600 mt-1">${statusCounts['In Progress']}</h4>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-400 uppercase">Resolved</p>
                            <h4 class="text-xl font-bold text-emerald-600 mt-1">${statusCounts.Resolved}</h4>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-400 uppercase">Closed</p>

                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-400 uppercase">Reopened</p>
                            <h4 class="text-xl font-bold text-purple-600 mt-1">${statusCounts.Reopened}</h4>
                        </div>
                    </div>

                    <!-- Advanced Filtering Toolbar -->
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">

                            <h4 class="text-xs font-bold text-slate-900 uppercase tracking-wider flex items-center space-x-1.5">
                                <i data-lucide="filter" class="w-4 h-4 text-blue-600"></i>
                                <span>Filter Issue Log</span>
                            </h4>
                            <button onclick="window.actions.resetFilters()" class="text-xs text-blue-600 hover:underline">Reset Filters</button>

                        <div class="grid grid-cols-1 sm:grid-cols-6 gap-2 text-xs">

                            <select onchange="window.actions.updateFilters({status: this.value})" class="p-2 rounded-xl border border-slate-200 bg-white">
                                <option value="All">All Statuses</option>
                                <option value="Assigned" ${filters.status === 'Assigned' ? 'selected' : ''}>Assigned</option>
                                <option value="In Progress" ${filters.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                <option value="Open" ${filters.status === 'Open' ? 'selected' : ''}>Open</option>
                                <option value="Closed" ${filters.status === 'Closed' ? 'selected' : ''}>Closed</option>
                                <option value="Reopened" ${filters.status === 'Reopened' ? 'selected' : ''}>Reopened</option>

                            <select onchange="window.actions.updateFilters({priority: this.value})" class="p-2 rounded-xl border border-slate-200 bg-white">

                                <option value="Normal" ${filters.priority === 'Normal' ? 'selected' : ''}>Normal</option>
                                <option value="Medium" ${filters.priority === 'Medium' ? 'selected' : ''}>Medium</option>
                                <option value="High" ${filters.priority === 'High' ? 'selected' : ''}>High</option>
                                <option value="Urgent" ${filters.priority === 'Urgent' ? 'selected' : ''}>Urgent</option>
                            </select>

                            <input type="date" title="Start Date" value="${filters.startDate}" onchange="window.actions.updateFilters({startDate: this.value})" class="p-2 rounded-xl border border-slate-200">
                            <input type="date" title="End Date" value="${filters.endDate}" onchange="window.actions.updateFilters({endDate: this.value})" class="p-2 rounded-xl border border-slate-200">
                            <input type="date" title="Create Date" value="${filters.createDate}" onchange="window.actions.updateFilters({createDate: this.value})" class="p-2 rounded-xl border border-slate-200">
                        </div>
                    </div>

                    <!-- Issue List Table -->
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-4 border-b border-slate-200 font-bold text-sm text-slate-900">Issues & Action Log (${projIssues.length})</div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                                    <tr>
                                        <th class="p-4">Issue Details & Priority</th>
                                        <th class="p-4">Timeline</th>
                                        <th class="p-4">Assigned User</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4">User Response & Attachments</th>
                                    </tr>

                                    ${projIssues.map(i => {
                                        const priorityColor = i.priority === 'Urgent' ? 'bg-red-100 text-red-700' : i.priority === 'High' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-700';
                                        return `
                                            <tr class="hover:bg-slate-50/50">
                                                <td class="p-4">

                                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${priorityColor}">${i.priority}</span>

                                                    <p class="text-slate-500 mt-1">${i.description}</p>
                                                </td>
                                                <td class="p-4 text-slate-600 space-y-0.5">
                                                    <div>Start: <strong>${i.startDate}</strong></div>
                                                    <div>End: <strong>${i.endDate}</strong></div>
                                                </td>
                                                <td class="p-4 font-medium text-slate-700">${i.assignedUser}</td>
                                                <td class="p-4">
                                                    <select onchange="window.actions.setIssueStatus('${i.id}', this.value)" class="p-2 rounded-xl border border-slate-200 bg-white font-semibold text-xs outline-none">
                                                        <option value="Assigned" ${i.status === 'Assigned' ? 'selected' : ''}>Assigned</option>
                                                        <option value="In Progress" ${i.status === 'In Progress' ? 'selected' : ''}>In Progress</option>

                                                        <option value="Closed" ${i.status === 'Closed' ? 'selected' : ''}>Closed</option>

                            </table>

                                <div><label class="block font-semibold mb-1">Start Date</label><input name="startDate" type="date" value="${today}" required class="w-full p-2.5 rounded-xl border"></div>
                                <div><label class="block font-semibold mb-1">End Date</label><input name="endDate" type="date" value="${today}" required class="w-full p-2.5 rounded-xl border"></div>
                                <div><label class="block font-semibold mb-1">Create Date</label><input name="createdAt" type="date" value="${today}" required class="w-full p-2.5 rounded-xl border"></div>
                            </div>
                            <div><label class="block font-semibold mb-1">Assigned User</label><input value="${project.assignedTo}" disabled class="w-full p-2.5 rounded-xl border bg-slate-100 text-slate-500"></div>
                            <div class="flex space-x-2 pt-2">
                                <button type="button" onclick="closeModal()" class="flex-1 py-2.5 bg-slate-100 rounded-xl">Cancel</button>
                                <button type="submit" class="flex-1 py-2.5 bg-blue-600 text-white rounded-xl">Save Issue</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }

        function closeModal() {
            const m = document.getElementById('custom-modal');
            if (m) m.remove();
        }

        function renderToast() {
            if (!state.toast) return '';
            return `
                <div class="fixed bottom-16 md:bottom-6 right-6 z-50 animate-bounce">
                    <div class="px-4 py-3 rounded-xl shadow-xl text-xs font-medium text-white flex items-center space-x-2 bg-slate-900">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-blue-400"></i>
                        <span>${state.toast.message}</span>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => { render(); });
    </script>
</body>
</html>
